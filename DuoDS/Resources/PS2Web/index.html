<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; touch-action: none; }
  /* The surround (duo.js drawSurround): each edge of the picture, extended to the screen edge and
     blurred. It reaches 48px past the page on every side so the blur stays even up to the border. */
  #ambientCanvas {
    left: -48px; top: -48px; width: calc(100% + 96px); height: calc(100% + 96px);
    filter: blur(10px) brightness(0.92);
    /* Below the picture the TV area ends at the black gap above the controller: fade to black
       from the picture's bottom edge to the end of the page instead of stopping at a line. */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(var(--picture-bottom, 100%) + 48px), transparent calc(100% - 20px));
    mask-image: linear-gradient(to bottom, #000 calc(var(--picture-bottom, 100%) + 48px), transparent calc(100% - 20px));
  }
  /* The picture's content (black border cropped away, see duo.js layoutPicture); its edges fade
     into their own blurred extension. */
  #pictureClip {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent),
                        linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent),
                linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent);
    mask-composite: intersect;
  }
  #outputCanvas { left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="ambientCanvas" width="64" height="48"></canvas>
<div id="pictureClip"><canvas id="outputCanvas" width="640" height="480"></canvas></div>
<script type="module" src="duo.js"></script>
</body>
</html>
